name: Build Installable APKs

on:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [Arm64-v8a, Armeabi-v7a, Universal]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell || true

      - name: Fix permissions
        run: chmod +x ./gradlew

      - name: Tune Gradle for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties

      # Generate a throwaway keystore so the release APKs are signed and directly
      # installable without requiring repository secrets. Replace this step with a
      # `timheuer/base64-to-file` decode of a real signing key for stable signatures.
      - name: Generate CI signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release_key.jks \
            -storetype JKS \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass refra-ci-keystore \
            -keypass refra-ci-key \
            -dname "CN=ReFra CI, OU=CI, O=ReFra, L=NA, ST=NA, C=US"

      - name: Build release APK
        run: ./gradlew --build-cache :app:assemble${{ matrix.arch }}NoMLRelease
        env:
          SIGNING_KEY_ALIAS: ci-upload
          SIGNING_KEY_PASSWORD: refra-ci-key
          SIGNING_STORE_PASSWORD: refra-ci-keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: refra-${{ matrix.arch }}
          path: app/build/outputs/apk-renamed/**/*.apk
